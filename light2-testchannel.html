<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <style>
        input[type=radio] {
            border: 0px;
            width: 10%;
            height: 2em;
            vertical-align: middle;
        }

        .slidecontainer {
            width: 95%;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 25px;
            background: #d2d3d0;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }

        .slider:hover {
            opacity: 1;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #04AA6D;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            background: #04AA6D;
            cursor: pointer;
        }

        /* ============================= */
        /* COLOR PICKERS */
        /* ============================= */

        .colorPickers {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
        }

        .colorPickerContainer {
            text-align: center;
        }

        .colorValue {
            margin-top: 8px;
            font-family: monospace;
            font-size: 16px;
        }

        /* ============================= */
        /* DIAGNOSTICS */
        /* ============================= */

        .diagnostics {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #aaa;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .diagnostics select {
            font-size: 18px;
            padding: 8px;
            margin-right: 10px;
        }

        .diagnostics button {
            font-size: 16px;
            padding: 10px 18px;
            height: 45px;
        }

        #diagnosticStatus {
            margin-top: 10px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <!-- IRO COLOR PICKER LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>


    <!-- ============================= -->
    <!-- COLOR PICKERS -->
    <!-- ============================= -->

    <div class="colorPickers">

        <div class="colorPickerContainer">

            <h3>Color 1</h3>

            <div id="picker1"></div>

            <div class="colorValue">
                <span id="color1Value">0xFF0000</span>
            </div>

        </div>


        <div class="colorPickerContainer">

            <h3>Color 2</h3>

            <div id="picker2"></div>

            <div class="colorValue">
                <span id="color2Value">0x0000FF</span>
            </div>

        </div>

    </div>


    <script>

        // =============================
        // COLOR PICKER 1
        // =============================

        var colorPicker1 = new iro.ColorPicker("#picker1", {
            width: 220,
            color: "#FF0000"
        });


        // =============================
        // COLOR PICKER 2
        // =============================

        var colorPicker2 = new iro.ColorPicker("#picker2", {
            width: 220,
            color: "#0000FF"
        });


        // =============================
        // PACK RGB INTO 32-BIT VALUE
        // =============================
        //
        // R = bits 23-16
        // G = bits 15-8
        // B = bits 7-0
        //
        // Example:
        //
        // Red       = 0x00FF0000
        // Green     = 0x0000FF00
        // Blue      = 0x000000FF
        // Purple    = 0x00FF00AA
        //
        // =============================

        function packedRGB(rgb) {

            return (
                (rgb.r << 16) |
                (rgb.g << 8) |
                rgb.b
            ) >>> 0;

        }


        // =============================
        // PACKED RGB -> HEX STRING
        // =============================

        function packedRGBHex(rgb) {

            return "0x" +
                packedRGB(rgb)
                    .toString(16)
                    .padStart(6, "0")
                    .toUpperCase();

        }


        // =============================
        // UPDATE COLOR VALUES
        // =============================

        function updateColorValues() {

            document.getElementById("color1Value").innerHTML =
                packedRGBHex(colorPicker1.color.rgb);

            document.getElementById("color2Value").innerHTML =
                packedRGBHex(colorPicker2.color.rgb);

        }


        colorPicker1.on("color:change", updateColorValues);

        colorPicker2.on("color:change", updateColorValues);

        updateColorValues();

    </script>


    <!-- ============================= -->
    <!-- BRIGHTNESS -->
    <!-- ============================= -->

    <div class="slidecontainer">

        <h3>
            Brightness Value:
            <span id="demo"></span>
        </h3>

        <input type="range"

               max="100"
               value="50"
               class="slider"
               id="myRange">

    </div>


    <!-- ============================= -->
    <!-- TIME ON -->

    <div class="slidecontainer">

        </h3>

        <input type="range"

               id="timeRange">

    </div>


    <!-- ============================= -->
    <!-- EFFECT -->
    <!-- ============================= -->

    <h3>Effect: </h3>

    <table>

                <br>


                <input type="radio"
                       id="fx3"

                <br>


                <input type="radio"

                <input type="radio"
                       id="fx5"
                       name="efx"

                <br>


                <input type="radio"
                       id="fx6"
                       name="efx"
                       value="6">

                <label for="fx6">bpm</label>
                <br>


                <input type="radio"
                       id="fx7"
                       name="efx"
                       value="7">

                <label for="fx7">juggle</label>
                <br>


                <input type="radio"
                       id="fx8"

    <!-- ============================= -->
    <!-- EFFECT SPEED -->
    <!-- ============================= -->

    <div class="slidecontainer">

        <h3>
            Effect Speed:
            <span id="fxSpeedLabel"></span>
        </h3>


        <input type="range"
               min="1"
               max="100"
               value="50"
               class="slider"
               id="fxSpeed">

    </div>


    <h5>Sumbittity do dah</h5>


    <input type="submit"
           value="Set Lights"
           onclick="submit()"
           style="height:50px; width:150px"
           id="submitButton">


    <!-- ============================= -->
    <!-- DIAGNOSTICS SECTION -->
    <!-- ============================= -->

    <div class="diagnostics">

        <h3>Diagnostics</h3>


        <label for="deviceNumber">
            Device Number:
        </label>


        <select id="deviceNumber">

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>

        </select>


        <button type="button"
                onclick="sendDiagnostics()">

            Send Diagnostics

        </button>


        <div id="diagnosticStatus"></div>

    </div>


    <!-- ============================= -->
    <!-- MAIN JAVASCRIPT -->
    <!-- ============================= -->

    <script type="text/javascript">


        // =============================
        // SLIDERS
        // =============================

        var slider =
            document.getElementById("myRange");

        var output =
            document.getElementById("demo");


        var timeOn =
            document.getElementById("timeRange");

        var tOut =
            document.getElementById("theTime");


        var lightSpeed =
            document.getElementById("fxSpeed");

        var lsOut =
            document.getElementById("fxSpeedLabel");


        output.innerHTML =
            slider.value;

        tOut.innerHTML =
            timeOn.value;

        lsOut.innerHTML =
            lightSpeed.value;


        slider.oninput = function () {

            output.innerHTML =
                this.value;

        };


        timeOn.oninput = function () {

            tOut.innerHTML =
                this.value;

        };


        lightSpeed.oninput = function () {

            lsOut.innerHTML =
                this.value;

        };


        // =============================
        // NORMAL LIGHT SUBMIT
        // =============================

        function submit() {

            var xhr =
                new XMLHttpRequest();


            var myUrl =
                'https://api.thingspeak.com/update?api_key=U0Q9H69T2119MWGV&field1=';


            var bright =
                document.getElementById("myRange").value;


            var lightSpeed =
                document.getElementById("fxSpeed").value;


            // Get packed RGB values

            var color1 =
                packedRGB(colorPicker1.color.rgb);


            var color2 =
                packedRGB(colorPicker2.color.rgb);


            var color1Hex =
                colorPicker1.color.hexString;


            var effectNum;


            var myButton =
                document.getElementById("submitButton");


            var fxRadios =
                document.getElementsByName("efx");


            for (var i = 0;
                 i < fxRadios.length;
                 i++) {

                if (fxRadios[i].checked) {

                    effectNum =
                        +fxRadios[i].value;

                }

            }


            var lightTime =
                timeOn.value;


            // Make button Color 1

            myButton.style.backgroundColor =
                color1Hex;


            myButton.style.borderWidth =
                effectNum.toString() + "px";


            var sleepTime = 0;


            // =============================
            // THINGSPEAK FIELDS
            // =============================
            //
            // field1 = brightness
            // field2 = packed Color 1
            // field3 = packed Color 2
            // field4 = unused
            // field5 = effect
            // field6 = time on
            // field7 = sleep time
            // field8 = effect speed
            //
            // =============================

            myUrl +=
                bright +
                "&field2=" + color1 +
                "&field3=" + color2 +
                "&field5=" + effectNum +
                "&field6=" + lightTime +
                "&field7=" + sleepTime +
                "&field8=" + lightSpeed;


            console.log(
                "Color 1:",
                packedRGBHex(colorPicker1.color.rgb),
                color1
            );


            console.log(
                "Color 2:",
                packedRGBHex(colorPicker2.color.rgb),
                color2
            );


            console.log(
                "ThingSpeak URL:",
                myUrl
            );


            xhr.onreadystatechange =
                function () {

                    if (xhr.readyState === 4) {

                        console.log(
                            "Status:",
                            xhr.status
                        );

                        console.log(
                            "Response:",
                            xhr.responseText
                        );

                    }

                };


            xhr.open(
                'GET',
                myUrl,
                true
            );


            xhr.send();


            updateMessage();

        }


        // =============================
        // DIAGNOSTICS
        // =============================

        function sendDiagnostics() {

            var xhr =
                new XMLHttpRequest();


            var deviceNumber =
                parseInt(
                    document
                        .getElementById("deviceNumber")
                        .value
                );


            // Device 1 -> 601
            // Device 2 -> 602
            // ...
            // Device 15 -> 615

            var pattern =
                deviceNumber + 600;


            var myUrl =
                'https://api.thingspeak.com/update?api_key=U0Q9H69T2119MWGV&field1=1&field5='
                + pattern;


            var status =
                document.getElementById(
                    "diagnosticStatus"
                );


            status.innerHTML =
                "Sending pattern " +
                pattern +
                "...";


            console.log(
                "Diagnostic device:",
                deviceNumber
            );


            console.log(
                "Diagnostic pattern:",
                pattern
            );


            console.log(
                "URL:",
                myUrl
            );


            xhr.onreadystatechange =
                function () {

                    if (xhr.readyState === 4) {

                        console.log(
                            "Diagnostics Status:",
                            xhr.status
                        );


                        console.log(
                            "Diagnostics Response:",
                            xhr.responseText
                        );


                        if (xhr.status === 200) {

                            status.innerHTML =
                                "Sent pattern " +
                                pattern +
                                " to ThingSpeak.";

                        }

                        else {

                            status.innerHTML =
                                "Error sending diagnostics (" +
                                xhr.status +
                                ")";

                        }

                    }

                };


            xhr.open(
                'GET',
                myUrl,
                true
            );


            xhr.send();

        }


        // =============================
        // BUTTON UPDATE
        // =============================

        function updateMessage() {

            var myButton =
                document.getElementById(
                    "submitButton"
                );


            myButton.style.backgroundColor =
                'White';


            setTimeout(
                function () {

                    updateRefresh();

                },
                500
            );

        }


        function updateRefresh() {

            var myButton =
                document.getElementById(
                    "submitButton"
                );


            myButton.style.backgroundColor =
                colorPicker1.color.hexString;

        }

    </script>

</body>

</html>
